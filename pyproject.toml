[project]
name = "arrangement-game-try"
version = "1.0.0"
description = "pygame trial work: put floors and chairs on an isometric grid."
readme = "README.md"
requires-python = ">=3.15"
dependencies = ["pygame-ce>=2.5.8"]

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.17.0"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py315"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "S", "C4", "PIE", "RET", "PT"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
